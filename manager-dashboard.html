<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Dashboard — ShiftTracker</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="manager-dashboard.html" style="text-decoration:none;">ShiftTracker</a>
  <div class="topbar-right">
    <a class="btn btn-outline" href="dashboard.html">My Shifts</a>
    <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">&#9728;</button>
    <div class="user-menu" id="userMenu" onclick="toggleUserDropdown()">
      <span id="userLabel">Manager</span> &#9662;
      <div class="user-dropdown" id="userDropdown">
        <button onclick="signOut()">Log out</button>
      </div>
    </div>
  </div>
</header>

<main class="dashboard">
  <div class="dashboard-head">
    <div>
      <h1 style="margin-bottom:0;">Manager Dashboard</h1>
      <p>Live status and hours for everyone on your team.</p>
    </div>
    <button class="btn btn-muted" id="refreshBtn">&#8635; Refresh</button>
  </div>

  <div class="summary-grid">
    <div class="summary-card total">
      <div class="label">Total Employees</div>
      <div class="value" id="sumTotal">0</div>
    </div>
    <div class="summary-card working">
      <div class="label">Currently Working</div>
      <div class="value" id="sumWorking">0</div>
    </div>
    <div class="summary-card break">
      <div class="label">On Break</div>
      <div class="value" id="sumBreak">0</div>
    </div>
    <div class="summary-card idle">
      <div class="label">Not Working</div>
      <div class="value" id="sumIdle">0</div>
    </div>
  </div>

  <div class="roster-card">
    <div class="roster-card-head">
      <h2>Employee Shift Status</h2>
    </div>
    <table class="roster-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Surname</th>
          <th>Status</th>
          <th>Started At</th>
          <th>Today</th>
          <th>Location</th>
        </tr>
      </thead>
      <tbody id="rosterBody">
        <tr><td colspan="6" class="roster-empty">Loading team…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/manager-dashboard.js"></script>
</body>
</html>
