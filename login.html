<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — ShiftTracker</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html" style="text-decoration:none;"><i class="fa-solid fa-business-time"></i>ShiftTracker</a>
  <div class="topbar-links">
    <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme"><i class="fa-solid fa-sun"></i></button>
    <a class="btn btn-muted" href="register.html"><i class="fa-solid fa-user-plus"></i>Register</a>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue tracking your shifts.</p>

    <div id="formMsg" class="form-msg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
        </div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn"><i class="fa-solid fa-right-to-bracket"></i>Sign In</button>
    </form>

    <div class="auth-foot">
      Don't have an account? <a href="register.html">Register</a><br>
      Are you a manager? <a href="manager-login.html">Manager login</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script>
  redirectIfAuthed();

  const form = document.getElementById("loginForm");
  const msg = document.getElementById("formMsg");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "form-msg";
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>Signing in...';

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msg.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i><span>${error.message}</span>`;
      msg.className = "form-msg error";
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i>Sign In';
      return;
    }

    const { data: { session } } = await supabaseClient.auth.getSession();
    const profile = await getProfile(session.user.id);
    window.location.href = homeForRole(profile?.role || "employee");
  });
</script>
</body>
</html>
