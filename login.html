<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — ShiftTracker</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html" style="text-decoration:none;">ShiftTracker</a>
  <div class="topbar-links">
    <a class="btn btn-muted" href="register.html">Register</a>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue tracking your shifts.</p>

    <div id="formMsg" class="form-msg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign In</button>
    </form>

    <div class="auth-foot">
      Don't have an account? <a href="register.html">Register</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
  redirectIfAuthed();

  const form = document.getElementById("loginForm");
  const msg = document.getElementById("formMsg");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "form-msg";
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msg.textContent = error.message;
      msg.className = "form-msg error";
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign In";
      return;
    }

    const { data: { session } } = await supabaseClient.auth.getSession();
    const profile = await getProfile(session.user.id);
    window.location.href = homeForRole(profile?.role || "employee");
  });
</script>
</body>
</html>
