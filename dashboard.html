<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — ShiftTracker</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="dashboard.html" style="text-decoration:none;">ShiftTracker</a>
  <div class="topbar-right">
    <div class="status-pill-wrap">
      Status: <span class="pill" id="statusPill"><span class="dot"></span><span id="statusPillText">Not Working</span></span>
    </div>
    <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">&#9728;</button>
    <div class="user-menu" id="userMenu" onclick="toggleUserDropdown()">
      <span id="userLabel">User</span> &#9662;
      <div class="user-dropdown" id="userDropdown">
        <button onclick="signOut()">Log out</button>
      </div>
    </div>
  </div>
</header>

<main class="dashboard">
  <h1>Employee Dashboard</h1>

  <div class="grid-2">
    <div class="card">
      <h2>Shift Actions</h2>
      <div class="actions-row" id="actionsRow">
        <button class="btn btn-primary" id="startBtn">&#9201; Start Shift</button>
      </div>
    </div>

    <div class="card">
      <h2>Shift Timer</h2>
      <div class="metric-box">
        <div class="label">Working Time</div>
        <div class="value" id="workingTime">0h 0m 0s</div>
      </div>
      <div class="metric-box">
        <div class="label">Break Time</div>
        <div class="value amber" id="breakTime">0h 0m 0s</div>
      </div>
      <div class="metric-box" id="startedAtBox" style="display:none;">
        <div class="label">Started At</div>
        <div class="value small" id="startedAt">--:--:--</div>
      </div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <h2>Shift Status</h2>
      <div class="status-banner not_working" id="statusBanner">
        &#128337; <span id="statusBannerText">Not Working</span>
      </div>
      <div class="stat-row">
        <div class="metric-box">
          <div class="label">Today</div>
          <div class="value small" id="statToday">0.00h</div>
        </div>
        <div class="metric-box">
          <div class="label">This Week</div>
          <div class="value small" id="statWeek">0.00h</div>
        </div>
        <div class="metric-box">
          <div class="label">This Month</div>
          <div class="value small" id="statMonth">0.00h</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Location</h2>
      <div id="map"></div>
      <div class="coords-row">
        <span>Latitude: <b id="latVal">—</b></span>
        <span>Longitude: <b id="lngVal">—</b></span>
      </div>
      <button class="btn btn-muted btn-block" id="updateLocationBtn">&#128205; Update Location</button>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
